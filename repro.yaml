# One row of Table 1 (arXiv:2604.21991), run by scripts/reproduce.py.
label: MONET_tuned
algorithm: MONET
domains: [archery, arm]
seeds: 1-10
workers: 2
max_evals: 1000000
overrides:
  # SPOT-tuned per-domain configs, SI table "SPOT-tuned MONET configurations"
  common:
    - algorithm.MONET.neighborhood=closest
  archery:
    - algorithm.MONET.strategy=best_fitness
    - algorithm.MONET.p_ind=0.0
    - algorithm.MONET.neighbor_percentage=0.02
  arm:
    - algorithm.MONET.strategy=random
    - algorithm.MONET.p_ind=0.3
    - algorithm.MONET.neighbor_percentage=0.01
